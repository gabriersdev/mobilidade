<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Notícias - Mobilidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="/favicon.png" type="image/png">
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input.is-invalid,
    textarea.is-invalid {
      border-color: #FFA9B1 !important;
    }

    .text-small,
    .btn-sm {
      font-size: 13px !important;
    }
  </style>
</head>
<body>

<div id="app" class="my-5">
  <vueapp></vueapp>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<script type="module">
  const API_BASE = '/__news-management';

  const DEFAULT_IMAGES = [
    '/news/busao-0800.png',
    '/news/carnaval.jpg',
    '/news/ferias.jpg',
    '/news/marcopolo-44114.png',
    '/news/marcopolo-44115.png',
    '/news/marcopolo-44117.png',
    '/news/neobus-44069.jpg',
    '/news/neobus-44089.jpg',
    '/news/neobus-44099.png',
    '/news/neobus-44101.jpg',
    '/news/neobus-44115.jpg',
    '/news/neobus-M28.png',
    '/news/soberania-brasil-gov-br.jpg'
  ];

  function createEmptyItem() {
    return {
      id: null,
      title: '',
      resume: '',
      img: '',
      publishDate: `${new Date().toISOString().split('T')[0]}T00:00`,
      fixed: false,
      content: ['']
    };
  }

  function normalizePublishDateInput(rawDate) {
    if (!rawDate) {
      return `${new Date().toISOString().split('T')[0]}T00:00`;
    }
    return String(rawDate).substring(0, 16);
  }

  function isItemCompletelyEmpty(item) {
    const hasContent = Array.isArray(item.content) && item.content.some(p => p.trim() !== '');
    return item.title.trim() === '' && item.resume.trim() === '' && !hasContent;
  }

  function mapNewsToUiItems(newsList) {
    const existingItems = newsList
      .slice()
      .sort((a, b) => a.id - b.id)
      .map(n => ({
        id: n.id,
        title: n.title || '',
        resume: n.resume || '',
        img: n.img || '',
        publishDate: normalizePublishDateInput(n.publishDate || n.publishDateRaw),
        fixed: Boolean(n.fixed),
        content: Array.isArray(n.content) && n.content.length > 0 ? [...n.content] : [''],
        recuperate: `Notícia salva - ID #${n.id}`
      }))
      .reverse();

    return [createEmptyItem(), ...existingItems];
  }

  async function loadInitialData() {
    try {
      const apiResponse = await fetch(`${API_BASE}/data`);
      if (apiResponse.ok) {
        const data = await apiResponse.json();
        if (data.ok) {
          return {
            apiAvailable: true,
            news: data.news || [],
            images: Array.isArray(data.images) && data.images.length > 0 ? data.images : DEFAULT_IMAGES,
            warning: ''
          };
        }
      }
    } catch {
      // Fallback abaixo se a API de desenvolvimento não estiver acessível
    }

    let fallbackNews = [];
    try {
      const jsonResponse = await fetch('./news.json');
      if (jsonResponse.ok) {
        fallbackNews = await jsonResponse.json();
      }
    } catch {
      // Ignora falha de leitura estática
    }

    return {
      apiAvailable: false,
      news: fallbackNews,
      images: DEFAULT_IMAGES,
      warning: 'Servidor local de salvamento não detectado. Execute "npm run dev" e acesse esta página pelo localhost do Vite (ex: http://localhost:5173/news-management/index.html) para salvar alterações diretamente nos arquivos.'
    };
  }

  const initialData = await loadInitialData();

  const vueapp = {
    template: `
      <div class="container-fluid">
        <div class="row">
          <aside class="col-md-3">
            <h2 class="text-body-tertiary mb-4 pb-2">lista de notícias</h2>
            <div class="list-group">
              <a
                v-for="(item, index) in items"
                :key="item.id !== null ? 'id-' + item.id : 'draft-' + index"
                href="#"
                @click.prevent="scrollToNews(index)"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-2 text-small"
              >
                <span class="text-truncate">{{ item.title || 'Nova Notícia' }}</span>
                <span v-if="item.id !== null" class="badge text-bg-light border text-muted">#{{ item.id }}</span>
                <span v-else class="badge text-bg-secondary">nova</span>
              </a>
            </div>
          </aside>

          <main class="col-md-9 mt-md-0 mt-5">
            <hr class="d-md-none">

            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
              <h1 class="fs-2 fw-medium text-lowercase mb-0" style="letter-spacing: -0.5px">notícias</h1>
              <div class="d-flex flex-wrap align-items-center gap-2">
                <button @click="addItem" type="button" class="btn btn-secondary" :disabled="isSaving">
                  Adicionar item
                </button>
                <button @click="saveAllItems" type="button" class="btn btn-primary" :disabled="isSaving || !apiAvailable">
                  {{ isSaving && savingIndex === null ? 'Salvando...' : 'Salvar todas' }}
                </button>
              </div>
            </div>

            <div v-if="statusMessage" :class="['alert', 'alert-' + statusVariant, 'alert-dismissible', 'fade', 'show']" role="alert">
              {{ statusMessage }}
              <button type="button" class="btn-close" aria-label="Fechar" @click="statusMessage = ''"></button>
            </div>

            <div class="accordion" id="newsAccordion">
              <div
                class="accordion-item"
                v-for="(item, index) in items"
                :key="item.id !== null ? 'acc-' + item.id : 'acc-draft-' + index"
                :id="'news-item-' + index"
              >
                <h2 class="accordion-header" :id="'heading' + index">
                  <button
                    :class="['accordion-button', index !== 0 ? 'collapsed' : '']"
                    type="button"
                    data-bs-toggle="collapse"
                    :data-bs-target="'#collapse' + index"
                    :aria-expanded="index === 0"
                    :aria-controls="'collapse' + index"
                  >
                    <span class="me-2">{{ item.title || 'Nova Notícia' }}</span>
                    <span v-if="item.id !== null" class="badge text-bg-light border text-muted fw-normal">#{{ item.id }}</span>
                  </button>
                </h2>
                <div
                  :id="'collapse' + index"
                  :class="['accordion-collapse', 'collapse', index === 0 ? 'show' : '']"
                  :aria-labelledby="'heading' + index"
                  data-bs-parent="#newsAccordion"
                >
                  <div class="accordion-body">
                    <form action="#" method="POST" @submit.prevent="saveSingleItem(index)">
                      <span v-if="item.recuperate" v-text="item.recuperate" class="fw-bold d-block mb-3 text-muted"></span>
                      <div>
                        <div class="d-flex gap-2 mb-3">
                          <div class="form-group w-50">
                            <label class="form-label mb-1 text-muted" :for="'title' + index">Título</label>
                            <input
                              v-model="item.title"
                              :id="'title' + index"
                              type="text"
                              class="form-control"
                              placeholder="Título"
                              required
                              @input="handleRequiredInput"
                            >
                          </div>
                          <div class="form-group w-50">
                            <label class="form-label mb-1 text-muted" :for="'resume' + index">Subtítulo</label>
                            <input
                              v-model="item.resume"
                              :id="'resume' + index"
                              type="text"
                              class="form-control"
                              placeholder="Subtítulo ou resumo"
                              required
                              @input="handleRequiredInput"
                            >
                          </div>
                        </div>

                        <div class="d-flex gap-2 mb-3">
                          <div class="form-group w-50">
                            <label class="form-label mb-1 text-muted" :for="'img' + index">URL da Imagem</label>
                            <input
                              v-model="item.img"
                              :id="'img' + index"
                              type="text"
                              list="newsImagesList"
                              class="form-control"
                              placeholder="/news/marcopolo-44117.png"
                            >
                          </div>
                          <div class="form-group w-50">
                            <label class="form-label mb-1 text-muted" :for="'publishDate' + index">Data de publicação</label>
                            <input
                              v-model="item.publishDate"
                              :id="'publishDate' + index"
                              type="datetime-local"
                              class="form-control"
                              required
                              @input="handleRequiredInput"
                            >
                          </div>
                        </div>

                        <div class="d-flex gap-2 mb-3">
                          <div class="form-check">
                            <input v-model="item.fixed" class="form-check-input" type="checkbox" role="switch" :id="'fixed' + index">
                            <label class="form-check-label text-muted" :for="'fixed' + index">Fixar notícia no topo</label>
                          </div>
                        </div>

                        <div class="mb-3">
                          <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label mb-0 text-muted">Parágrafos do conteúdo</label>
                          </div>
                          <div v-for="(p, pIdx) in item.content" :key="pIdx" class="d-flex gap-2 mb-2">
                            <textarea
                              :id="'news-' + index + '-paragraph-' + pIdx"
                              v-model="item.content[pIdx]"
                              class="form-control"
                              rows="2"
                              :placeholder="'Parágrafo #' + (pIdx + 1)"
                              required
                              @input="handleRequiredInput"
                            ></textarea>
                            <button
                              tabindex="-1"
                              v-if="item.content.length > 1"
                              @click="removeParagraph(item, pIdx)"
                              type="button"
                              class="btn btn-danger btn-sm align-self-start"
                              title="Remover parágrafo"
                            >×</button>
                          </div>
                          <button type="button" class="btn btn-sm btn-secondary" @click="addParagraph(item, index)">
                            Adicionar parágrafo
                          </button>
                        </div>

                        <div class="d-flex gap-2 mt-4 mb-0">
                          <button type="submit" class="btn btn-primary" :disabled="isSaving || !apiAvailable">
                            {{ savingIndex === index ? 'Salvando...' : 'Salvar notícia' }}
                          </button>
                          <button @click="removeItem(index)" type="button" class="btn btn-outline-danger" :disabled="isSaving">
                            Remover item
                          </button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>

        <datalist id="newsImagesList">
          <option v-for="imagePath in availableImages" :key="imagePath" :value="imagePath"></option>
        </datalist>
      </div>`,
    data() {
      return {
        items: mapNewsToUiItems(initialData.news),
        availableImages: initialData.images,
        apiAvailable: initialData.apiAvailable,
        isSaving: false,
        savingIndex: null,
        statusMessage: initialData.warning,
        statusVariant: initialData.warning ? 'warning' : 'success'
      };
    },
    methods: {
      setStatus(message, variant = 'success') {
        this.statusMessage = message;
        this.statusVariant = variant;
      },
      validateItem(item) {
        if (item.title.trim() === '' || item.resume.trim() === '' || !item.publishDate) {
          return 'Preencha título, subtítulo e data de publicação.';
        }
        const validParagraphs = item.content.filter(p => p.trim() !== '');
        if (validParagraphs.length === 0) {
          return 'Adicione pelo menos um parágrafo de conteúdo.';
        }
        return '';
      },
      serializeItem(item) {
        return {
          id: item.id,
          title: item.title,
          resume: item.resume,
          img: item.img,
          publishDate: item.publishDate,
          fixed: Boolean(item.fixed),
          content: item.content
        };
      },
      async saveSingleItem(index) {
        const item = this.items[index];
        const validationError = this.validateItem(item);
        if (validationError) {
          this.setStatus(validationError, 'danger');
          return;
        }

        this.isSaving = true;
        this.savingIndex = index;

        try {
          const response = await fetch(`${API_BASE}/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mode: 'single',
              item: this.serializeItem(item)
            })
          });

          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.error || 'Falha ao salvar notícia.');
          }

          this.items = mapNewsToUiItems(data.news);
          this.setStatus(
            `Notícia #${data.savedId} salva em src/assets/news/${data.savedId}.js. index.js e news.json atualizados.`,
            'success'
          );
        } catch (error) {
          console.error('Erro ao salvar notícia:', error);
          this.setStatus(`Erro ao salvar notícia: ${error.message}`, 'danger');
        } finally {
          this.isSaving = false;
          this.savingIndex = null;
        }
      },
      async saveAllItems() {
        const itemsToSave = this.items.filter(item => !(item.id === null && isItemCompletelyEmpty(item)));
        if (itemsToSave.length === 0) {
          this.setStatus('Nenhuma notícia preenchida para salvar.', 'warning');
          return;
        }

        for (const item of itemsToSave) {
          const validationError = this.validateItem(item);
          if (validationError) {
            this.setStatus(`Erro em "${item.title || 'Nova Notícia'}": ${validationError}`, 'danger');
            return;
          }
        }

        this.isSaving = true;
        this.savingIndex = null;

        try {
          const orderedPayload = itemsToSave.slice().reverse().map(item => this.serializeItem(item));
          const response = await fetch(`${API_BASE}/save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mode: 'all',
              items: orderedPayload
            })
          });

          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.error || 'Falha ao salvar notícias.');
          }

          this.items = mapNewsToUiItems(data.news);
          this.setStatus(
            `${data.savedCount} notícias salvas em src/assets/news/. index.js e news.json atualizados.`,
            'success'
          );
        } catch (error) {
          console.error('Erro ao salvar notícias:', error);
          this.setStatus(`Erro ao salvar notícias: ${error.message}`, 'danger');
        } finally {
          this.isSaving = false;
        }
      },
      addItem() {
        this.items.unshift(createEmptyItem());
        this.$nextTick(() => {
          this.scrollToNews(0);
          const inputTitle = document.querySelector('#title0');
          if (inputTitle) inputTitle.focus();
        });
      },
      async removeItem(index) {
        const item = this.items[index];

        if (item.id === null) {
          if (this.items.length <= 1) {
            this.items[0] = createEmptyItem();
            return;
          }
          this.items.splice(index, 1);
          return;
        }

        if (!this.apiAvailable) {
          this.setStatus('Inicie o servidor local (npm run dev) para remover notícias salvas.', 'warning');
          return;
        }

        const confirmed = confirm(
          `Deseja remover a notícia #${item.id} ("${item.title}")?\n\nIsso apagará src/assets/news/${item.id}.js e atualizará index.js e news.json.`
        );
        if (!confirmed) return;

        this.isSaving = true;
        try {
          const response = await fetch(`${API_BASE}/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: item.id })
          });

          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.error || 'Falha ao remover notícia.');
          }

          this.items = mapNewsToUiItems(data.news);
          this.setStatus(`Notícia #${data.deletedId} removida e arquivos index.js e news.json atualizados.`, 'success');
        } catch (error) {
          console.error('Erro ao remover notícia:', error);
          this.setStatus(`Erro ao remover notícia: ${error.message}`, 'danger');
        } finally {
          this.isSaving = false;
        }
      },
      addParagraph(item, index) {
        item.content.push('');
        const newParagraphIndex = item.content.length - 1;
        this.$nextTick(() => {
          const targetInput = document.getElementById(`news-${index}-paragraph-${newParagraphIndex}`);
          if (targetInput) {
            targetInput.focus();
          }
        });
      },
      removeParagraph(item, pIndex) {
        if (item.content.length <= 1) {
          this.setStatus('A notícia deve possuir ao menos um parágrafo.', 'warning');
          return;
        }
        item.content.splice(pIndex, 1);
      },
      handleRequiredInput(event) {
        const value = event.target.value.trim();
        const input = event.target;
        if (value === '') {
          input.classList.add('is-invalid');
        } else {
          input.classList.remove('is-invalid');
        }
      },
      scrollToNews(index) {
        const newsItem = document.getElementById(`news-item-${index}`);
        const collapseTarget = document.getElementById(`collapse${index}`);

        if (newsItem && collapseTarget) {
          if (collapseTarget.classList.contains('show')) {
            newsItem.scrollIntoView({ behavior: 'smooth' });
            return;
          }

          const scrollOnceShown = () => {
            newsItem.scrollIntoView({ behavior: 'smooth' });
            collapseTarget.removeEventListener('shown.bs.collapse', scrollOnceShown);
          };

          collapseTarget.addEventListener('shown.bs.collapse', scrollOnceShown);

          const collapseInstance = bootstrap.Collapse.getOrCreateInstance(collapseTarget);
          collapseInstance.show();
        }
      }
    }
  };

  const app = Vue.createApp({
    components: {
      vueapp
    }
  });

  Vue.nextTick(() => {
    setTimeout(() => {
      const inputTitle = document.querySelector('#title0');
      if (inputTitle) inputTitle.focus();
    }, 250);
  });

  app.mount('#app');
</script>

</body>
</html>
